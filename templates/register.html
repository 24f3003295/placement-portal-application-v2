<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Placement Portal</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link rel="stylesheet" href="/static/portal.css">
  <style>
    .role-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
      margin-bottom: 4px;
    }
    .role-option {
      display: flex; align-items: center; gap: 12px;
      padding: 16px; border: 1.5px solid var(--border);
      border-radius: var(--radius-md); cursor: pointer;
      transition: all var(--transition); font-weight: 600;
      font-size: 14px; color: var(--text-secondary);
      background: var(--surface);
      user-select: none;
    }
    .role-option .role-icon { font-size: 24px; }
    .role-option small { display: block; font-size: 12px; font-weight: 400; color: var(--text-muted); margin-top: 2px; }
    .role-option:hover   { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
    .role-option.selected{ border-color: var(--accent); background: var(--accent-light); color: var(--accent); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media(max-width:460px){ .form-row{ grid-template-columns:1fr; } }

    .fields-section {
      padding: 18px;
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      margin-bottom: 4px;
      animation: fadeUp .25s ease both;
    }
    .fields-section-label {
      font-size: 12px; font-weight: 700; color: var(--accent);
      text-transform: uppercase; letter-spacing: .06em; margin-bottom: 14px;
      display: flex; align-items: center; gap: 6px;
    }

    .login-link {
      text-align: center; margin-top: 18px;
      font-size: 14px; color: var(--text-secondary);
    }
    .login-link a {
      color: var(--accent); font-weight: 600; text-decoration: none;
    }
    .login-link a:hover { text-decoration: underline; }

    .error-msg {
      background: var(--danger-light); color: var(--danger);
      border: 1px solid #FECACA;
      border-radius: var(--radius-md); padding: 11px 14px;
      font-size: 13.5px; margin-bottom: 16px;
    }

    .auth-card { max-width: 520px; }
  </style>
</head>
<body>
<div id="app">
  <div class="auth-page">
    <div class="auth-card">

      <div class="auth-logo">
        <div class="auth-logo-icon">P</div>
        <div>
          <div class="auth-logo-text">PlacementHub</div>
        </div>
      </div>

      <h2>Create an account</h2>
      <p class="auth-sub">Join the placement portal today</p>

      <!-- Error -->
      <div class="error-msg" v-if="error">[[ error ]]</div>

      <!-- Role -->
      <div class="form-group">
        <label>I am a…</label>
        <div class="role-grid">
          <div class="role-option" :class="{selected: role==='company'}" @click="role='company'">
            <span class="role-icon">🏢</span>
            <div>
              Company
              <small>Post jobs & hire</small>
            </div>
          </div>
          <div class="role-option" :class="{selected: role==='student'}" @click="role='student'">
            <span class="role-icon">🎓</span>
            <div>
              Student
              <small>Find & apply to jobs</small>
            </div>
          </div>
        </div>
      </div>

      <!-- Common -->
      <div class="form-row">
        <div class="form-group">
          <label>Email</label>
          <input class="form-control" v-model="email" placeholder="you@example.com" type="email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input class="form-control" v-model="password" type="password" placeholder="Min. 8 chars">
        </div>
      </div>

      <!-- Company Fields -->
      <div class="fields-section" v-if="role === 'company'">
        <div class="fields-section-label">🏢 Company Details</div>
        <div class="form-group">
          <label>Company Name</label>
          <input class="form-control" v-model="company_name" placeholder="Acme Corp">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Industry</label>
            <input class="form-control" v-model="industry" placeholder="e.g. Technology">
          </div>
          <div class="form-group">
            <label>Location</label>
            <input class="form-control" v-model="location" placeholder="e.g. Mumbai">
          </div>
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label>Website</label>
          <input class="form-control" v-model="website" placeholder="https://yourcompany.com">
        </div>
      </div>

      <!-- Student Fields -->
      <div class="fields-section" v-if="role === 'student'">
        <div class="fields-section-label">🎓 Student Details</div>
        <div class="form-group" style="margin-bottom:0">
          <label>Full Name</label>
          <input class="form-control" v-model="name" placeholder="Your full name">
        </div>
      </div>

      <div style="margin-top:20px">
        <button class="btn btn-primary btn-lg" @click="register" :disabled="loading">
          <span v-if="loading">Creating account…</span>
          <span v-else>Create Account →</span>
        </button>
      </div>

      <div class="login-link">
        Already have an account? <a href="/login">Sign in</a>
      </div>

    </div>
  </div>
</div>

<script src="/static/register.js"></script>
</body>
</html>
