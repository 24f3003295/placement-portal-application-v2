<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Placement Portal</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link rel="stylesheet" href="/static/portal.css">
  <style>
    .auth-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 22px 0;
      color: var(--text-muted); font-size: 13px;
    }
    .auth-divider::before, .auth-divider::after {
      content: ''; flex: 1;
      height: 1px; background: var(--border);
    }
    .role-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      margin-bottom: 20px;
    }
    .role-option {
      display: flex; flex-direction: column; align-items: center;
      gap: 7px; padding: 14px 8px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition);
      font-size: 13px; font-weight: 600;
      color: var(--text-secondary);
      background: var(--surface);
      user-select: none;
    }
    .role-option .role-icon { font-size: 22px; }
    .role-option:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
    .role-option.selected { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
    .role-label { font-size: 12px; }
    .register-link {
      text-align: center; margin-top: 22px;
      font-size: 14px; color: var(--text-secondary);
    }
    .register-link a, .register-link span {
      color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: none;
    }
    .register-link span:hover { text-decoration: underline; }
    .error-msg {
      background: var(--danger-light); color: var(--danger);
      border: 1px solid #FECACA;
      border-radius: var(--radius-md); padding: 11px 14px;
      font-size: 13.5px; margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .input-icon-wrap { position: relative; }
    .input-icon-wrap .form-control { padding-left: 40px; }
    .input-icon-wrap .input-icon {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: 15px; pointer-events: none;
    }
  </style>
</head>
<body>
<div id="app">
  <div class="auth-page">
    <div class="auth-card">

      <div class="auth-logo">
        <div class="auth-logo-icon">P</div>
        <div>
          <div class="auth-logo-text">PlacementHub</div>
        </div>
      </div>

      <h2>Welcome back</h2>
      <p class="auth-sub">Sign in to your account to continue</p>

      <!-- Role selector -->
      <div class="form-group">
        <label>Select Role</label>
        <div class="role-grid">
          <div class="role-option" :class="{selected: role==='admin'}" @click="role='admin'">
            <span class="role-icon">🛡️</span>
            <span class="role-label">Admin</span>
          </div>
          <div class="role-option" :class="{selected: role==='company'}" @click="role='company'">
            <span class="role-icon">🏢</span>
            <span class="role-label">Company</span>
          </div>
          <div class="role-option" :class="{selected: role==='student'}" @click="role='student'">
            <span class="role-icon">🎓</span>
            <span class="role-label">Student</span>
          </div>
        </div>
      </div>

      <div class="error-msg" v-if="error">
        <span>⚠️</span> [[ error ]]
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <div class="input-icon-wrap">
          <span class="input-icon">✉️</span>
          <input class="form-control" v-model="email" placeholder="you@example.com" type="email">
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-icon-wrap">
          <span class="input-icon">🔒</span>
          <input class="form-control" v-model="password" type="password" placeholder="••••••••">
        </div>
      </div>

      <button class="btn btn-primary btn-lg" @click="login" :disabled="loading">
        <span v-if="loading">Signing in…</span>
        <span v-else>Sign In →</span>
      </button>

      <div class="register-link">
        Don't have an account? <span @click="goToRegister">Create one</span>
      </div>

    </div>
  </div>
</div>

<script src="/static/login.js"></script>
<script>
/* Patch Vue app to add error/loading state */
(function(){
  const _mount = window.__vue_login_patched;
})();
</script>
</body>
</html>
